<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OBS overlay · 100 ngày ăn xin online</title><style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800;900&display=swap');
*{box-sizing:border-box}html,body{margin:0;background:transparent!important;overflow:hidden;color:#65416f;font-family:'Be Vietnam Pro',system-ui,sans-serif}.wrap{padding:24px;width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}.board{min-width:min(600px,90vw);max-width:95vw;background:linear-gradient(130deg,#fff7f0ed,#ffe9f8f0);border:4px solid #75517d;border-radius:21px;box-shadow:7px 7px 0 #85578c9c;overflow:hidden;text-align:center}.bar{background:#f0b9d7;border-bottom:3px solid #75517d;height:34px;text-align:left;padding:6px 13px;font-size:11px;font-weight:900}.data{padding:20px 22px 17px}.label{font-size:12px;letter-spacing:.04em;font-weight:900}.amount{font-size:clamp(39px,7vw,75px);font-weight:900;letter-spacing:-.06em;line-height:1.35;color:#b25d95;white-space:nowrap}.state{font-size:10px;font-weight:800;color:#8f7597}.alert{margin-top:22px;background:#fff6eb;border:3px solid #75517d;box-shadow:5px 5px 0 #75517d80;border-radius:13px;max-width:550px;padding:17px 25px;display:none;text-align:center;font-size:18px;font-weight:900;line-height:1.55}.alert.show{display:block;animation:pop .5s ease-out}.alert small{font-size:11px;color:#ae7cac;display:block;margin-top:5px}@keyframes pop{from{transform:translateY(30px) scale(.9);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
</style></head><body><div class="wrap"><div class="board"><div class="bar">♡ fundraising-live.exe ─ □ ×</div><div class="data"><div class="label">♡ ĐÃ NHẬN ĐƯỢC THÁNG NÀY ♡</div><div class="amount" id="total">0 ₫</div><div class="state" id="status">CHƯA KẾT NỐI GIAO DỊCH</div></div></div><div id="alert" class="alert" role="status" aria-live="polite"></div></div>
<script>
'use strict';const $=s=>document.querySelector(s);let connected=false,fadeTimer;const fmt=n=>new Intl.NumberFormat('vi-VN').format(Math.max(0,Number(n)||0));
async function update(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();connected=!!d.connected;$('#total').textContent=fmt(d.stats.total)+' ₫';$('#status').textContent=connected?'● SỐ TIỀN ĐÃ XÁC MINH QUA GIAO DỊCH':'CHƯA KẾT NỐI WEBHOOK · KHÔNG PHẢI LIVE'}catch{$('#status').textContent='MẤT KẾT NỐI MÁY CHỦ'}}
update();const e=new EventSource('/api/events');e.addEventListener('update',ev=>{let data;try{data=JSON.parse(ev.data)}catch{data={}}update();if(!data.receipt)return;const a=$('#alert');a.replaceChildren();const first=document.createElement('div');if(data.receipt.show&&data.receipt.name){first.textContent='♡ '+data.receipt.name+' đã ủng hộ '+fmt(data.receipt.amount)+' ₫!'}else{first.textContent='♡ Có một lượt ủng hộ mới!'}const sub=document.createElement('small');sub.textContent=data.receipt.show&&data.receipt.message?'✉ '+String(data.receipt.message).slice(0,90):'Cảm ơn bạn đã tiếp sức cho chuyến phiêu lưu';a.append(first,sub);a.classList.remove('show');void a.offsetWidth;a.classList.add('show');clearTimeout(fadeTimer);fadeTimer=setTimeout(()=>a.classList.remove('show'),10000)});setInterval(update,45000);
</script></body></html>
